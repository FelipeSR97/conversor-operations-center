name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pyproj pyflakes
      - run: python -m pyflakes conversor_oc/*.py conversor_oc/core/conversor.py conversor_oc/core/isoxml.py tests
      - run: pytest -q
      - run: python scripts/empacotar.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: conversor_oc
          path: dist/conversor_oc.zip
